<!DOCTYPE html>
<html>
    <style>
        @import url('http://fonts.cdnfonts.com/css/pokemon-solid');
        body{
            text-align: center;
        }
        .letter{
            font-family: 'Pokemon Solid', sans-serif;
            display: inline-block;
            letter-spacing: 5px;
            font-size: 50px;
            color: #ffcb05;
            text-shadow: -3px 0 black, 0 3px black, 3px 0 black, 0 -3px black;
        }
        .letter.active{
            transform: scale(1.5) rotate(20deg);
        }
        h1{
            display: inline-block;
            margin: 0 0 5px 0;
            line-height: 1;
            vertical-align: middle;
        }
        img {
            display: inline-block;
            height: 100px;
            width: 100px;
        }
        #myImage {
            display: inline-block;
            margin-left: auto;
            margin-right: auto;
            box-shadow: #fff 4px 4px 0 0, #000 4px 4px 0 1px;
            text-shadow: -3px 0 black, 0 3px black, 3px 0 black, 0 -3px black;
        }   
        #bach:hover{
            animation-name: bosch;
            animation-duration: 1.2s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            filter: brightness(100%);
        }
        @keyframes bosch{
            0%{
                transform: rotate(0deg);
            }
            100%{
                transform: rotate(360deg);
            }
        }
        .vastolorde {
            appearance: button;
            background-color:red;
            background-image: none;
            border: 1px solid #000;
            border-radius: 4px;
            box-shadow: #fff 4px 4px 0 0,#000 4px 4px 0 1px;
            box-sizing: border-box;
            color: #fff;
            cursor: pointer;
            display: inline-block;
            font-family: 'Pokemon Solid', sans-serif;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 10px;
            line-height: 20px;
            margin: 0 5px 10px 0;
            overflow: visible;
            padding: 12px 40px;
            text-align: center;
            text-transform: none;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            vertical-align: middle;
            white-space: nowrap;
            }

        .vastolorde:active {
            box-shadow: rgba(0, 0, 0, .125) 0 3px 5px inset;
            outline: 0;
        }

        .vastolorde:not([disabled]):active {
            box-shadow: #fff 2px 2px 0 0, red 2px 2px 0 1px;
            transform: translate(2px, 2px);
        }

        @media (min-width: 768px) {
        .vastolorde {
            padding: 12px 50px;
        }
        }
        #pokedex, #nihongo, #niponjin {
            position: absolute;
            right: 5%;
            width: 400px;
            font-family: "Comic Sans MS", "Comic Sans", cursive;
            color: #333;
            text-shadow: none;
            font-weight: normal;
            text-align: center;
            letter-spacing: 1px;
            line-height: 1.4;
        }
        #nihongo {
            top: calc(15% + 90px);
            font-size: 20px;
            transform: translateY(-48px)
        }
        #niponjin {
            top: calc(20% + 90px);
            font-size: 20px;
            transform: translateY(-48px)
        }
        #pokedex {
            top: calc(20% + 145px);
            height: 400px;
            overflow-y: auto;
            font-size: 17px;
            transform: translateY(-48px)
        }
        #pokemonInfo {
            font-family: 'Pokemon Solid', sans-serif;
            display: inline-block;
            letter-spacing: 5px;
            font-size: 25px;
            color: #ffcb05;
            text-shadow: -1.5px 0 black, 0 1.5px black, 1.5px 0 black, 0 -1.5px black;
        }
        .container {
            text-align: center;
            position: relative;
        }
        #myImage {
            display: inline-block;
            margin-left: auto;
            margin-right: auto;
            box-shadow: #fff 4px 4px 0 0, #000 4px 4px 0 1px;
            text-shadow: -3px 0 black, 0 3px black, 3px 0 black, 0 -3px black;
            max-width: 100%;
            max-height: 100%;
        }
        .selectyourversion {
            font-family: 'Pokemon Solid', sans-serif;
            position: absolute;
            top: 100px;
            left: 20%;
            display: none;
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
        }
        .selectyourversion button {
            font-family: 'Pokemon Solid', sans-serif;
            padding: 10px 20px;
            border: 2px solid #000;
            cursor: pointer;
        }
        body {
            background-color: powderblue;
        }
        body.bursted {
            background-image: url('static/bubbly.jpg');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
        }
        .takeshi{
            position: fixed;
            bottom: 1px;
            right: -150px; 
            width: 767px;
            height: 767px;
            box-sizing: border-box;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: flex-end;
            border: none;
            background-color: transparent;
        }
        #castImage {
            position: absolute;
            bottom: 0;
            right: -2in; 
            width: 115%; 
            max-height: 250%; 
            object-fit: contain; 
            margin: 0;
            display: none;
        }
    </style>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/jpg" sizes="16x16" href="static/pokeball.jpg">
        <script src="{{ url_for('static', filename='pokemon_dictionary.js') }}"></script>
    </head>
        <img src="static/pokeball.jpg" id="bach">
        <h1>Pokémon!</h1>
        <br>
        <br>
        <div>
            <a href="https://maattthhhh.github.io/Tracking-ISS/tracking_iss.html"><img id="myImage" src="static/pikachu.gif" style="width:300px; height: 300px"></a>
        </div>
        <div id="pokemonInfo"></div>
        <br>
        <p id="nihongo"></p>
        <br>
        <p id="niponjin"></p>
        <div id="pokedex">
            {{ cleaned_text }}
        </div>
        <div id="sizeSelector" class="selectyourversion">
            <button id="prevSize" style="background-color: #4a5568;">Silver</button>
            <button id="presSize" style="background-color: #a7d8de;">Crystal</button>
            <button id="nextSize" style="background-color: #ffd700;">Gold</button>
        </div>
        <button onclick="gary()" class="vastolorde">Generate Random Pokémon!</button>
        <script>
            let intervalId;
            function gary(){
                const AD = Math.ceil(Math.random()*150);
                const myPokemon = mapping[AD];
                const digimon = [
                    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-ii/silver/" + AD + ".png",
                    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-ii/crystal/" + AD + ".png",
                    "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-ii/gold/" + AD + ".png"
                ]
                const maincast = [
                    'static/ash.png', 'static/misty.png', 'static/brock.png', 'static/jessie.png', 'static/james.png', 'static/gary.png', 'static/oak.png', 'static/delia.png'
                ]
                var avatar = document.querySelector(".selectyourversion");
                var brock = document.getElementById("myImage");
                let misty = 0
                while (misty < 150){
                    brock.src = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-ii/crystal/"+AD+".png";
                    misty++;
                }
                var xhr = new XMLHttpRequest();
                xhr.onreadystatechange = function() {
                    if (xhr.readyState == 4 && xhr.status == 200) {
                        var response = JSON.parse(xhr.responseText);
                        document.getElementById("pokedex").innerHTML = "<p>" + response.cleaned_text + "</p><br>";
                    }
                }
                xhr.open('GET', '/get_pokemon?pokemonName=' + myPokemon, true);
                xhr.send();

                checkPokemon(myPokemon)
                document.getElementById("prevSize").onclick = function() {
                    clearInterval(intervalId);
                    brock.src = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-ii/silver/" + AD + ".png";
                };
                document.getElementById("presSize").onclick = function() {
                    clearInterval(intervalId);
                    brock.src = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-ii/crystal/" + AD + ".png";
                };
                document.getElementById("nextSize").onclick = function() {
                    clearInterval(intervalId);
                    brock.src = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-ii/gold/" + AD + ".png";
                };
                clearInterval(intervalId);
                let index = 0;
                intervalId = setInterval(function() {
                    index = (index + 1) % digimon.length;

                    document.getElementById("myImage").src = digimon[index];

                }, 500);
                avatar.style.display = "flex";
                function showRandomPic() {
                    // 1. Generate a random index between 0 and the length of the array
                    const randomIndex = Math.floor(Math.random() * maincast.length);
                    
                    // 2. Get the image element by its ID
                    const imgElement = document.getElementById('castImage')
                    imgElement.style.display = 'block';
                    imgElement.src = maincast[randomIndex];
                }
                showRandomPic()
            
            const katakanaToRomaji = {
                // Basic vowels
                'ア': 'a', 'イ': 'i', 'ウ': 'u', 'エ': 'e', 'オ': 'o',

                // K
                'カ': 'ka', 'キ': 'ki', 'ク': 'ku', 'ケ': 'ke', 'コ': 'ko',

                // S
                'サ': 'sa', 'シ': 'shi', 'ス': 'su', 'セ': 'se', 'ソ': 'so',

                // T
                'タ': 'ta', 'チ': 'chi', 'ツ': 'tsu', 'テ': 'te', 'ト': 'to',

                // N
                'ナ': 'na', 'ニ': 'ni', 'ヌ': 'nu', 'ネ': 'ne', 'ノ': 'no',

                // H
                'ハ': 'ha', 'ヒ': 'hi', 'フ': 'fu', 'ヘ': 'he', 'ホ': 'ho',

                // M
                'マ': 'ma', 'ミ': 'mi', 'ム': 'mu', 'メ': 'me', 'モ': 'mo',

                // Y
                'ヤ': 'ya', 'ユ': 'yu', 'ヨ': 'yo',

                // R
                'ラ': 'ra', 'リ': 'ri', 'ル': 'ru', 'レ': 're', 'ロ': 'ro',

                // W and N
                'ワ': 'wa', 'ヲ': 'wo', 'ン': 'n',

                // Voiced K
                'ガ': 'ga', 'ギ': 'gi', 'グ': 'gu', 'ゲ': 'ge', 'ゴ': 'go',

                // Voiced S
                'ザ': 'za', 'ジ': 'ji', 'ズ': 'zu', 'ゼ': 'ze', 'ゾ': 'zo',

                // Voiced T
                'ダ': 'da', 'ヂ': 'ji', 'ヅ': 'zu', 'デ': 'de', 'ド': 'do',

                // Voiced H (B)
                'バ': 'ba', 'ビ': 'bi', 'ブ': 'bu', 'ベ': 'be', 'ボ': 'bo',

                // Semi-voiced H (P)
                'パ': 'pa', 'ピ': 'pi', 'プ': 'pu', 'ペ': 'pe', 'ポ': 'po',

                // V sound
                'ヴ': 'vu',

                // Small vowels
                'ァ': 'a', 'ィ': 'i', 'ゥ': 'u', 'ェ': 'e', 'ォ': 'o',

                // Small Y
                'ャ': 'ya', 'ュ': 'yu', 'ョ': 'yo',

                // Other small characters
                'ヮ': 'wa', 'ヵ': 'ka', 'ヶ': 'ke',

                // Obsolete characters
                'ヰ': 'wi', 'ヱ': 'we',

                // Small tsu: requires special handling in your conversion function
                'ッ': '',

                // Long vowel mark: requires special handling depending on your rules
                'ー': '',

                // Common two-character combinations
                'キャ': 'kya', 'キュ': 'kyu', 'キョ': 'kyo',
                'シャ': 'sha', 'シュ': 'shu', 'ショ': 'sho',
                'チャ': 'cha', 'チュ': 'chu', 'チョ': 'cho',
                'ニャ': 'nya', 'ニュ': 'nyu', 'ニョ': 'nyo',
                'ヒャ': 'hya', 'ヒュ': 'hyu', 'ヒョ': 'hyo',
                'ミャ': 'mya', 'ミュ': 'myu', 'ミョ': 'myo',
                'リャ': 'rya', 'リュ': 'ryu', 'リョ': 'ryo',
                'ギャ': 'gya', 'ギュ': 'gyu', 'ギョ': 'gyo',
                'ジャ': 'ja', 'ジュ': 'ju', 'ジョ': 'jo',
                'ヂャ': 'ja', 'ヂュ': 'ju', 'ヂョ': 'jo',
                'ビャ': 'bya', 'ビュ': 'byu', 'ビョ': 'byo',
                'ピャ': 'pya', 'ピュ': 'pyu', 'ピョ': 'pyo',

                // Common foreign-word combinations
                'シェ': 'she', 'ジェ': 'je', 'チェ': 'che',
                'ティ': 'ti', 'ディ': 'di',
                'トゥ': 'tu', 'ドゥ': 'du',
                'ツァ': 'tsa', 'ツィ': 'tsi', 'ツェ': 'tse', 'ツォ': 'tso',
                'ファ': 'fa', 'フィ': 'fi', 'フェ': 'fe', 'フォ': 'fo',
                'フュ': 'fyu',
                'ウィ': 'wi', 'ウェ': 'we', 'ウォ': 'wo',
                'ヴァ': 'va', 'ヴィ': 'vi', 'ヴェ': 've', 'ヴォ': 'vo',
                'ヴュ': 'vyu',
                'イェ': 'ye',
                'キェ': 'kye', 'ギェ': 'gye',
                'クァ': 'kwa', 'クィ': 'kwi', 'クェ': 'kwe', 'クォ': 'kwo',
                'グァ': 'gwa', 'グィ': 'gwi', 'グェ': 'gwe', 'グォ': 'gwo'
            };

            function convertToRomajiFallback(katakanaStr) {
                if (!katakanaStr) return "Romaji not found";
                return katakanaStr.split('').map(char => katakanaToRomaji[char] || char).join('');
            }
            async function getPokemon() {
                const req = await fetch(
                    "https://pokeapi.co/api/v2/pokemon/" + myPokemon
                );
                if (req.ok) {
                    const ash = await req.json();
                    const speciesReq = await fetch(ash.species.url);
                    const species = await speciesReq.json();
                    document.body.classList.add("bursted");
                    const japanese = species.names.find(
                        name => name.language.name === "ja"
                    );
                    let roomaji = species.names.find(
                        name => name.language.name === "roomaji"
                    );
                    let finalRomaji = roomaji ? roomaji.name : null;
                    if (!finalRomaji && japanese) {
                        finalRomaji = convertToRomajiFallback(japanese.name);
                        document.getElementById("niponjin").innerHTML = `Romaji: ${finalRomaji.charAt(0).toUpperCase() + finalRomaji.slice(1)}`
                    }
                    document.getElementById("nihongo").innerHTML = japanese ? `Japanese Name: ${japanese.name}` : "Japanese name not found";
            }}
            getPokemon();
        }
        </script>
        <script>
            const h1 = document.querySelector("h1")
            const letters = h1.innerText.split('')
            let html = ""
            letters.forEach(letter=>{
                let classes = ''
                if(letter!==' '){
                    classes = 'letter js-letter'
                }
                html = html + `<span class ="${classes}">${letter}</span>`
            })
            h1.innerHTML = html
            const jsLetters = document.querySelectorAll(".js-letter")
            jsLetters.forEach(node=>{
                node.addEventListener("mouseover", function(event){
                    this.classList.add("active")
                })
                node.addEventListener("mouseout", function(event){
                    this.classList.remove("active")
                })
            })
        </script>
        <script>
            function toggleDropdown() {
                var dropdownContent = document.getElementById("dropdownContent");
                dropdownContent.classList.toggle("show");
            }
            window.onclick = function(event) {
                if (!event.target.matches('#dropdownButton')) {
                    var dropdowns = document.getElementsByClassName("dropdown-content");
                    var i;
                    for (i = 0; i < dropdowns.length; i++) {
                        var openDropdown = dropdowns[i];
                        if (openDropdown.classList.contains('show')) {
                            openDropdown.classList.remove('show');
                        }
                    }
                }
            }
        </script>
    <body>
        <div class="takeshi">
            <!-- The image tag where the random picture will show -->
            <img id="castImage" src="static/ash.png" alt="Cast Member" style="display: none;">
        </div>
    </body>
